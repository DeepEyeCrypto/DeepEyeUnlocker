plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// Add Java toolchain for Java 17 compatibility (Java 25 parsing issue)
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// ── Load signing properties (gitignored) ────────────────────
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.deepeye.otg'
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion "25.1.8937393"

    defaultConfig {
        applicationId "com.deepeye.otg"
        minSdk 26
        targetSdk 35
        versionCode 2027102
        versionName "2027.1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                cFlags "-std=c11"
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_PLATFORM=android-26"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // ── Signing configs ────────────────────────────────────────
    signingConfigs {
        release {
            def storeFilePath = keystoreProps['STORE_FILE']
            def storePwd      = keystoreProps['STORE_PASSWORD']
            def keyAl          = keystoreProps['KEY_ALIAS']
            def keyPwd         = keystoreProps['KEY_PASSWORD']
            def ciStoreFilePath = System.getenv("KEYSTORE_PATH")
            def ciStorePwd      = System.getenv("STORE_PASSWORD")
            def ciKeyAlias      = System.getenv("KEY_ALIAS")
            def ciKeyPwd        = System.getenv("KEY_PASSWORD")

            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true

            if (storeFilePath != null && storePwd != null &&
                keyAl != null && keyPwd != null) {
                // Local signing via keystore.properties
                storeFile     file(storeFilePath)
                storePassword storePwd
                keyAlias      keyAl
                keyPassword   keyPwd
            } else if (ciStoreFilePath != null && ciStorePwd != null &&
                ciKeyAlias != null && ciKeyPwd != null) {
                // CI signing via environment variables
                storeFile     file(ciStoreFilePath)
                storePassword ciStorePwd
                keyAlias      ciKeyAlias
                keyPassword   ciKeyPwd
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-DEBUG"
        }
        release {
            debuggable false
            minifyEnabled true
            // Resource shrink is currently stalling release packaging after R8.
            // Keep code shrinking enabled, but skip resource shrinking so
            // assembleRelease can complete deterministically.
            shrinkResources false
            def releaseSigning = signingConfigs.release
            signingConfig releaseSigning.storeFile != null && releaseSigning.storeFile.exists()
                ? releaseSigning
                : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            useLegacyPackaging = false
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3:1.3.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    // Stage 3: JADX libraries for APK Analysis
    implementation("io.github.skylot:jadx-core:1.5.0")
    implementation("io.github.skylot:jadx-dex-input:1.5.0")

    // Stage 5: TensorFlow Lite for AI Anomaly Detection
    implementation("org.tensorflow:tensorflow-lite:2.14.0")
    implementation("org.tensorflow:tensorflow-lite-support:0.4.4")
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    
    // Haze for Glassmorphism
    implementation 'dev.chrisbanes.haze:haze:1.3.1'

    // Zip for Encrypted Vaults
    implementation 'net.lingala.zip4j:zip4j:2.11.5'

    // Logging
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // Security for Stage C Cloud
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Networking for Stage H Tunnel
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Hilt DI
    implementation "com.google.dagger:hilt-android:2.51.1"
    ksp "com.google.dagger:hilt-compiler:2.51.1"
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    // Room Persistence
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // ── Test dependencies ───────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation "androidx.room:room-testing:$room_version"
    testImplementation 'org.robolectric:robolectric:4.13'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
