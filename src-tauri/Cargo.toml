[package]
name = "deep-eye-unlocker-desktop"
version = "2026.12.0"
description = "DeepEye Unlocker — iOS Backup Research Tool"
authors = ["DeepEye Research"]
edition = "2021"

[lib]
name = "deep_eye_unlocker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
