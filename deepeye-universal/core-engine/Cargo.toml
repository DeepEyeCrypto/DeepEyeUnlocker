[package]
name = "core_engine"
version = "0.1.0"
edition = "2021"
description = "DeepEye Universal Core Execution Engine"

[lib]
name = "deepeyecore"
crate-type = ["cdylib", "rlib"] # cdylib for Android JNI/Tauri, rlib for Rust dependencies

[[bin]]
name = "deepeye-cli"
path = "src/main.rs"

[dependencies]
nusb = "0.1" # Modern, memory-safe USB manipulation
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full", "macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "0.38.0", features = ["bundled"] }
