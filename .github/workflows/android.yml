name: Android CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PASS 1 — GlobalScope leak
        run: |
          count=$(grep -rn "GlobalScope" app/src/main/kotlin/ | wc -l)
          echo "GlobalScope violations: $count"
          [ "$count" -eq 0 ] || exit 1

      - name: PASS 2 — Raw bulkTransfer
        run: |
          count=$(grep -rn "\.bulkTransfer(" app/src/main/kotlin/ | grep -v "UsbExtensions" | wc -l)
          echo "Raw bulkTransfer violations: $count"
          [ "$count" -eq 0 ] || exit 1

      - name: PASS 3 — Lifecycle-unsafe collect
        run: |
          count=$(grep -rn "\.collectAsState()" app/src/main/kotlin/com/deepeye/otg/ui/ | wc -l)
          echo "Unsafe collectAsState violations: $count"
          [ "$count" -eq 0 ] || exit 1

      - name: PASS 4 — Fake delay detection
        run: |
          count=$(grep -rn "delay(" app/src/main/kotlin/ | grep -E "delay\((8|9)[0-9]{2}\)" | wc -l)
          echo "Fake delay violations: $count"
          [ "$count" -eq 0 ] || exit 1

      - name: Pass 7 — Apple raw USB violation
        run: |
          count=$(grep -rn "bulkTransfer\|bulkOut\|bulkIn" app/src/main/kotlin/ | grep -Ei "apple|0x05ac|iphone|ipad" | wc -l)
          echo "Apple raw USB violations: $count"
          [ "$count" -eq 0 ] || exit 1

      - name: PASS 8 — MTK raw bulkTransfer violation
        run: |
          count=$(grep -rn "\.bulkTransfer(" app/src/main/kotlin/com/deepeye/otg/ | grep -Ei "mtk|mediatek|brom|preloader" | wc -l)
          echo "MTK raw bulkTransfer violations: $count"
          [ "$count" -eq 0 ] || exit 1

      - name: PASS 9 — Vendored nested git repos in src-tauri
        run: |
          count=$(find src-tauri/ -name ".git" -not -path "src-tauri/.git" -type d | wc -l)
          echo "Nested .git folders in src-tauri: $count"
          [ "$count" -eq 0 ] || exit 1

      - name: PASS 10 — FRP/CVE Hardcoded Payloads
        run: |
          count=$(grep -rn "payloads/" app/src/main/kotlin/ | grep -vE "CveRegistry|ExploitExecutor|MtkDeviceUseCase" | wc -l)
          echo "FRP/CVE payload reference violations: $count"
          [ "$count" -eq 0 ] || exit 1

      - name: PASS 11 — Frida std::process::Command violation
        run: |
          if [ -f src-tauri/src/frida.rs ]; then
            count=$(grep -rn "std::process::Command" src-tauri/src/frida.rs | wc -l)
            echo "Frida std::process violations: $count"
            [ "$count" -eq 0 ] || exit 1
          else
            echo "src-tauri/src/frida.rs not found, skipping"
          fi

  test:
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Remove local org.gradle.java.home
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties || true

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Remove local org.gradle.java.home
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties || true

      - name: Build debug APK
        run: ./gradlew --stacktrace --info assembleDebug --no-daemon

      - name: Build release APK diagnostics
        run: ./gradlew --stacktrace --info assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: app/build/outputs/apk/release/
