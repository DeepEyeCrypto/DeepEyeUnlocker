name: DeepEyeUnlocker CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Ubuntu system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libusb-1.0-0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            pkg-config

      - name: Check Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check

      - name: Run Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run cargo check
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run build
