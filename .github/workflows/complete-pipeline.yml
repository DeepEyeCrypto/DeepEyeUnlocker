name: DeepEyeUnlocker Complete CI/CD Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.11"
  RUST_VERSION: "stable"
  NODE_VERSION: "24"
  JAVA_VERSION: "17"

on:
  push:
    branches: [ main, develop ]
    tags:
      - "v*"
    paths-ignore:
      - '**.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version (e.g., v2027.18.1)'
        required: false
        type: string
      build_type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - full
          - desktop-only
          - android-only
          - test-only
        default: 'full'

permissions:
  contents: write
  packages: write
  checks: write
  actions: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # STAGE 1: VALIDATION & TESTING
  # ─────────────────────────────────────────────────────────────
  
  validate-codebase:
    name: Validate Codebase
    runs-on: ubuntu-latest
    outputs:
      has-rust-changes: ${{ steps.changes.outputs.rust }}
      has-android-changes: ${{ steps.changes.outputs.android }}
      has-frontend-changes: ${{ steps.changes.outputs.frontend }}
      has-python-changes: ${{ steps.changes.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            android:
              - 'app/**'
              - 'build.gradle.kts'
              - 'app/build.gradle.kts'
              - 'gradle.properties'
            frontend:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'pnpm-lock.yaml'
              - 'vite.config.ts'
              - 'tsconfig.json'
            python:
              - 'src-tauri/python/**'
              - 'app/src/main/python/**'
              - 'requirements*.txt'

      - name: Run TypeScript validation
        if: github.event_name == 'pull_request' || steps.changes.outputs.frontend == 'true'
        run: |
          npm ci
          npx tsc --noEmit

      - name: Run Jest tests
        if: github.event_name == 'pull_request'
        run: |
          npm ci
          npm test -- --coverage --watchAll=false

      - name: Upload test coverage
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  test-rust-components:
    name: Test Rust Components
    runs-on: ubuntu-latest
    needs: validate-codebase
    if: github.event_name == 'pull_request' || needs.validate-codebase.outputs.has-rust-changes == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev \
            libdbus-1-dev \
            libssl-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            pkg-config

      - name: Run Rust formatter check
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Run Rust linter (clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      - name: Run Rust unit tests
        run: cargo test --release
        working-directory: src-tauri

      - name: Check for security vulnerabilities
        run: cargo audit || echo "cargo-audit not available or no vulnerabilities found"
        working-directory: src-lint
        continue-on-error: true

  test-android-components:
    name: Test Android Components
    runs-on: ubuntu-latest
    needs: validate-codebase
    if: github.event_name == 'pull_request' || needs.validate-codebase.outputs.has-android-changes == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Remove local org.gradle.java.home
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties || true

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run Kotlin lint
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true

      - name: Run Detekt static analysis
        run: ./gradlew detekt --no-daemon
        continue-on-error: true

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/
          retention-days: 7

  test-python-components:
    name: Test Python Components
    runs-on: ubuntu-latest
    needs: validate-codebase
    if: github.event_name == 'pull_request' || needs.validate-codebase.outputs.has-python-changes == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          if [ -f "src-tauri/python/requirements.txt" ]; then pip install -r src-tauri/python/requirements.txt; fi
          pip install pyusb==1.2.1 construct==2.10.68 pycryptodome==3.20.0 ecdsa==0.19.0

      - name: Run Python linter (flake8)
        run: |
          pip install flake8
          find . -name "*.py" -not -path "./.venv/*" -not -path "./node_modules/*" | xargs flake8 || true
        continue-on-error: true

      - name: Run Python tests
        run: |
          pip install pytest
          find . -name "test_*.py" -o -name "*_test.py" | xargs pytest || echo "No Python tests found"
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────
  # STAGE 2: DESKTOP BUILD (TAURI)
  # ─────────────────────────────────────────────────────────────

  build-tauri-macos-arm:
    name: Build Tauri macOS ARM64
    runs-on: macos-latest
    needs: [validate-codebase]
    if: |
      github.event_name == 'workflow_dispatch' && 
      (github.event.inputs.build_type == 'full' || github.event.inputs.build_type == 'desktop-only') ||
      (github.event_name != 'workflow_dispatch' && 
       (needs.validate-codebase.outputs.has-rust-changes == 'true' || 
        needs.validate-codebase.outputs.has-frontend-changes == 'true' ||
        startsWith(github.ref, 'refs/tags/v')))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install macOS dependencies
        run: brew install libusb

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri app (ARM64)
        env:
          CI: "true"
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SKIP_NOTARIZATION: "true"
        run: |
          pnpm tauri build --target aarch64-apple-darwin --bundles app

      - name: Build macOS PKG installer
        run: |
          chmod +x src-tauri/resources/macos/pkg/postinstall
          bash ./scripts/build_macos_pkg.sh --skip-build --target aarch64-apple-darwin
        continue-on-error: true

      - name: Upload macOS ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos-arm64
          path: |
            target/aarch64-apple-darwin/release/bundle/pkg/*.pkg
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-tauri-macos-intel:
    name: Build Tauri macOS x86_64
    runs-on: macos-latest
    needs: [validate-codebase]
    if: |
      github.event_name == 'workflow_dispatch' && 
      (github.event.inputs.build_type == 'full' || github.event.inputs.build_type == 'desktop-only') ||
      (github.event_name != 'workflow_dispatch' && 
       (needs.validate-codebase.outputs.has-rust-changes == 'true' || 
        needs.validate-codebase.outputs.has-frontend-changes == 'true' ||
        startsWith(github.ref, 'refs/tags/v')))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install macOS dependencies
        run: brew install libusb

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri app (x86_64)
        env:
          CI: "true"
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SKIP_NOTARIZATION: "true"
        run: |
          pnpm tauri build --target x86_64-apple-darwin --bundles app

      - name: Upload macOS x86_64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos-x86_64
          path: |
            target/x86_64-apple-darwin/release/bundle/pkg/*.pkg
            target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-tauri-linux:
    name: Build Tauri Linux
    runs-on: ubuntu-22.04
    needs: [validate-codebase]
    if: |
      github.event_name == 'workflow_dispatch' && 
      (github.event.inputs.build_type == 'full' || github.event.inputs.build_type == 'desktop-only') ||
      (github.event_name != 'workflow_dispatch' && 
       (needs.validate-codebase.outputs.has-rust-changes == 'true' || 
        needs.validate-codebase.outputs.has-frontend-changes == 'true' ||
        startsWith(github.ref, 'refs/tags/v')))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev \
            build-essential \
            libdbus-1-dev \
            libssl-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            pkg-config

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri app (Linux)
        env:
          CI: "true"
        run: |
          pnpm tauri build --target x86_64-unknown-linux-gnu --bundles appimage,deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux
          path: |
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

  build-tauri-windows:
    name: Build Tauri Windows
    runs-on: windows-latest
    needs: [validate-codebase]
    if: |
      github.event_name == 'workflow_dispatch' && 
      (github.event.inputs.build_type == 'full' || github.event.inputs.build_type == 'desktop-only') ||
      (github.event_name != 'workflow_dispatch' && 
       (needs.validate-codebase.outputs.has-rust-changes == 'true' || 
        needs.validate-codebase.outputs.has-frontend-changes == 'true' ||
        startsWith(github.ref, 'refs/tags/v')))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Windows dependencies
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { 'C:\vcpkg' }
          & "$vcpkgRoot\vcpkg.exe" install libusb:x64-windows

      - name: Install JavaScript dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri app (Windows)
        env:
          CI: "true"
        shell: bash
        run: |
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # STAGE 3: ANDROID BUILD
  # ─────────────────────────────────────────────────────────────

  build-android-debug:
    name: Build Android Debug APK
    runs-on: ubuntu-22.04
    needs: [validate-codebase]
    if: |
      github.event_name == 'workflow_dispatch' && 
      (github.event.inputs.build_type == 'full' || github.event.inputs.build_type == 'android-only') ||
      (github.event_name != 'workflow_dispatch' && 
       (needs.validate-codebase.outputs.has-android-changes == 'true' || 
        needs.validate-codebase.outputs.has-frontend-changes == 'true' ||
        github.event_name == 'pull_request'))
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Remove local org.gradle.java.home
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties || true

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  build-android-release:
    name: Build Android Release APK
    runs-on: ubuntu-22.04
    needs: [validate-codebase]
    if: |
      github.event_name == 'workflow_dispatch' && 
      (github.event.inputs.build_type == 'full' || github.event.inputs.build_type == 'android-only') ||
      (github.event_name != 'workflow_dispatch' && 
       (needs.validate-codebase.outputs.has-android-changes == 'true' || 
        startsWith(github.ref, 'refs/tags/v')))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Remove local org.gradle.java.home
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties || true

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Decode Android keystore
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          keystore_base64="${ANDROID_KEYSTORE_BASE64:-${KEYSTORE_BASE64:-}}"
          if [ -n "${keystore_base64}" ]; then
            echo "${keystore_base64}" | base64 --decode > app/deepeye-release.jks
          else
            echo "WARNING: No keystore secret available, building unsigned APK"
          fi

      - name: Write Android signing properties
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          store_password="${ANDROID_STORE_PASSWORD:-${KEYSTORE_PASS:-${STORE_PASSWORD:-}}}"
          key_alias="${ANDROID_KEY_ALIAS:-${KEY_ALIAS:-}}"
          key_password="${ANDROID_KEY_PASSWORD:-${KEY_PASS:-${KEY_PASSWORD:-}}}"

          if [ -n "${store_password}" ] && [ -n "${key_alias}" ] && [ -n "${key_password}" ]; then
            cat > local.properties <<EOF
          KEYSTORE_PATH=app/deepeye-release.jks
          KEYSTORE_PASS=${store_password}
          KEY_ALIAS=${key_alias}
          KEY_PASS=${key_password}
          EOF
          else
            echo "WARNING: Missing signing secrets, building unsigned APK"
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --info

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # STAGE 4: INTEGRATION TESTING
  # ─────────────────────────────────────────────────────────────

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-android-debug, build-tauri-linux]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Run integration test suite
        run: |
          echo "Running integration tests..."
          # Add integration test commands here
          # Example: npm run test:integration
          # Example: ./scripts/run_integration_tests.sh
          echo "Integration tests placeholder - implement as needed"
        continue-on-error: true

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            **/test-results/**
            **/integration-reports/**
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # STAGE 5: RELEASE & DEPLOYMENT
  # ─────────────────────────────────────────────────────────────


  # ─────────────────────────────────────────────────────────────
  # STAGE 6: NOTIFICATION & REPORTING
  # ─────────────────────────────────────────────────────────────

  notify-completion:
    name: Notify Build Completion
    runs-on: ubuntu-latest
    needs: [
      build-tauri-macos-arm,
      build-tauri-macos-intel,
      build-tauri-linux,
      build-tauri-windows,
      build-android-release
    ]
    if: always()
    steps:
      - name: Build summary
        run: |
          echo "## Build Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch/Tag**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: COMPLETE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Desktop: macOS (ARM64 + x86_64), Linux, Windows" >> $GITHUB_STEP_SUMMARY
          echo "- Mobile: Android APK (Debug + Release)" >> $GITHUB_STEP_SUMMARY
          echo "- Features: iOS Bypass, Android FRP, Firmware Flashing, Device Protocols" >> $GITHUB_STEP_SUMMARY
