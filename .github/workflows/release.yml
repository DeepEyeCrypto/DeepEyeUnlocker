name: DeepEyeUnlocker - Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks
          else
            keytool -genkeypair -v -keystore app/release.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias key0 -dname "CN=DeepEye, OU=Mobile, O=DeepEyeCrypto, L=Cyber, S=Net, C=US" \
              -storepass android -keypass android
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'key0' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}
        run: |
          chmod +x gradlew
          ./gradlew clean :app:assembleRelease --no-daemon

      - name: Locate Artifact
        id: locate
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*-release.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not found!"
            exit 1
          fi
          cp "$APK_PATH" "DeepEyeUnlocker-Android-${{ github.ref_name }}.apk"
          echo "apk_path=DeepEyeUnlocker-Android-${{ github.ref_name }}.apk" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: DeepEyeUnlocker-Android-*.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
