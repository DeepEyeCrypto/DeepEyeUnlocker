name: DeepEyeUnlocker Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            label: macOS-Universal
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          common_packages=(
            build-essential
            curl
            file
            libgtk-3-dev
            librsvg2-dev
            libssl-dev
            patchelf
            pkg-config
          )

          webkit_package=""
          for candidate in libwebkit2gtk-4.1-dev libwebkit2gtk-4.0-dev; do
            if apt-cache show "$candidate" >/dev/null 2>&1; then
              webkit_package="$candidate"
              break
            fi
          done

          appindicator_package=""
          for candidate in libayatana-appindicator3-dev libappindicator3-dev; do
            if apt-cache show "$candidate" >/dev/null 2>&1; then
              appindicator_package="$candidate"
              break
            fi
          done

          if [ -z "$webkit_package" ]; then
            echo "Unable to resolve a WebKitGTK development package on this runner."
            exit 1
          fi

          if [ -z "$appindicator_package" ]; then
            echo "Unable to resolve an AppIndicator development package on this runner."
            exit 1
          fi

          echo "Using Linux packages: $webkit_package $appindicator_package"
          sudo apt-get install -y "${common_packages[@]}" "$webkit_package" "$appindicator_package"

      - name: Install JS dependencies
        shell: bash
        run: |
          npm ci

      - name: Show desktop toolchain versions
        shell: bash
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          npx tauri --version

      - name: Sync version from tag
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          export VERSION
          # [INFERRED] Cross-platform JSON patch avoids BSD/GNU sed differences on GitHub runners.
          node -e 'const fs=require("fs");const path="src-tauri/tauri.conf.json";const data=JSON.parse(fs.readFileSync(path,"utf8"));data.version=process.env.VERSION;fs.writeFileSync(path, JSON.stringify(data, null, 2)+"\n");'
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Synced version to $VERSION"

      - name: Build frontend & Tauri app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ""
        run: |
          npx tauri build --target ${{ matrix.target }}

      - name: Build frontend & Tauri app (non-macOS)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          npx tauri build --target ${{ matrix.target }}

      - name: Inspect desktop bundle output
        shell: bash
        run: |
          echo "Inspecting src-tauri/target after build"
          if [ -d src-tauri/target ]; then
            find src-tauri/target -maxdepth 6 -type f | sort
          else
            echo "src-tauri/target does not exist"
          fi

      - name: Collect desktop bundle artifacts
        id: collect-desktop-artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import sys

          target = os.environ["TARGET"]
          preferred_root = Path("src-tauri") / "target" / target / "release" / "bundle"
          search_roots = [preferred_root, Path("src-tauri") / "target"]
          allowed_suffixes = {".dmg", ".deb", ".appimage", ".exe"}
          collected: list[str] = []

          def maybe_add(path: Path) -> None:
              if path.is_file() and path.suffix.lower() in allowed_suffixes:
                  collected.append(path.as_posix())

          if preferred_root.exists():
              for entry in preferred_root.rglob("*"):
                  maybe_add(entry)

          if not collected:
              for entry in search_roots[1].rglob("*"):
                  if entry.is_file() and "/release/bundle/" in entry.as_posix():
                      collected.append(entry.as_posix())

          collected = sorted(dict.fromkeys(collected))

          if not collected:
              print(f"No desktop bundle artifacts found for target {target}", file=sys.stderr)
              sys.exit(1)

          print("Discovered desktop bundle artifacts:")
          for item in collected:
              print(item)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("paths<<EOF\n")
              fh.write("\n".join(collected))
              fh.write("\nEOF\n")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepEyeUnlocker_${{ matrix.label }}
          path: ${{ steps.collect-desktop-artifacts.outputs.paths }}
          retention-days: 30
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android NDK
        shell: bash
        run: |
          # [INFERRED] P007/P008 remediation from the DeepEye v7 CI hardening brief.
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "y" | sdkmanager "ndk;27.0.12077973" --sdk_root="$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          ls "$SDK_ROOT/ndk/" | grep "27.0"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            i686-linux-android,
            x86_64-linux-android
      - name: Install JS dependencies
        shell: bash
        run: |
          pnpm install

      - name: Show Android toolchain versions
        shell: bash
        run: |
          node --version
          pnpm --version
          java -version
          rustc --version
          cargo --version
          pnpm exec tauri --version

      - name: Sync version from tag
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          export VERSION
          # [INFERRED] Cross-platform JSON patch avoids BSD/GNU sed differences on GitHub runners.
          node -e 'const fs=require("fs");const path="src-tauri/tauri.conf.json";const data=JSON.parse(fs.readFileSync(path,"utf8"));data.version=process.env.VERSION;fs.writeFileSync(path, JSON.stringify(data, null, 2)+"\n");'
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Synced version to $VERSION"

      - run: pnpm tauri android init
      - run: pnpm tauri android build --apk

      - name: Inspect Android output
        shell: bash
        run: |
          echo "Inspecting src-tauri/gen/android/app/build/outputs after build"
          if [ -d src-tauri/gen/android/app/build/outputs ]; then
            find src-tauri/gen/android/app/build/outputs -maxdepth 8 -type f | sort
          else
            echo "src-tauri/gen/android/app/build/outputs does not exist"
          fi

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: src-tauri/gen/android/app/build/outputs/apk/universal/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename signed APK
        id: rename_signed_apk
        shell: bash
        run: |
          SIGNED_PATH="${{ steps.sign_apk.outputs.signedReleaseFile }}"
          if [ ! -f "$SIGNED_PATH" ]; then
            echo "Signed APK not found at $SIGNED_PATH"
            exit 1
          fi

          # [INFERRED] The signing action resolves the final signed path; rename after signing to keep a stable release filename.
          FINAL_PATH="$(dirname "$SIGNED_PATH")/DeepEyeUnlocker_${VERSION}.apk"
          mv "$SIGNED_PATH" "$FINAL_PATH"
          echo "path=$FINAL_PATH" >> "$GITHUB_OUTPUT"
          echo "Renamed signed APK to $FINAL_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: DeepEyeUnlocker-Android
          retention-days: 30
          path: ${{ steps.rename_signed_apk.outputs.path }}
          if-no-files-found: error

  create-release:
    needs: [build, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Inspect downloaded artifacts
        shell: bash
        run: |
          if [ -d ./artifacts ]; then
            find ./artifacts -maxdepth 8 -type f | sort
          else
            echo "No downloaded artifacts directory found"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/**/*
          body_path: .github/release-template.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
