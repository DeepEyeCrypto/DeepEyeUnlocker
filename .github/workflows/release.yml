name: Android Signed Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-signed:
    name: Build Signed APK
    runs-on: ubuntu-latest

    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}

    steps:
      # ── Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Java 17 ───────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── Android SDK ───────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── Decode keystore from secret ───────────────────────
      - name: Decode keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" \
              | base64 --decode > $RUNNER_TEMP/deepeye-release.jks
            echo "KEYSTORE_PATH=$RUNNER_TEMP/deepeye-release.jks" >> $GITHUB_ENV
            echo "✅ Production keystore decoded"
          else
            echo "⚠️ No KEYSTORE_BASE64 secret — generating ephemeral keystore"
            keytool -genkeypair -v \
              -keystore $RUNNER_TEMP/deepeye-release.jks \
              -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 1 \
              -alias deepeye \
              -dname "CN=DeepEye CI, OU=CI, O=DeepEyeCrypto, L=CI, S=CI, C=US" \
              -storepass android -keypass android
            echo "KEYSTORE_PATH=$RUNNER_TEMP/deepeye-release.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=deepeye" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      # ── Verify keystore ──────────────────────────────────
      - name: Verify keystore
        run: |
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -noprompt 2>&1 | head -5
          echo "✅ Keystore valid"

      # ── Build signed release APK ──────────────────────────
      - name: Remove local org.gradle.java.home
        run: sed -i '/org.gradle.java.home/d' gradle.properties || true

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace

      # ── Verify APK signature ──────────────────────────────
      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::Release APK not found!"
            ls -R app/build/outputs/apk/ || true
            exit 1
          fi
          echo "APK: $APK ($(du -sh "$APK" | cut -f1))"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner \
            verify --verbose "$APK" || echo "⚠️ apksigner not available, skipping verify"

      # ── Rename APK with version tag ───────────────────────
      - name: Rename APK
        run: |
          mkdir -p artifacts
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          VERSION="${{ github.ref_name }}"
          if [ "$VERSION" = "main" ] || [ -z "$VERSION" ]; then
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          cp "$APK" "artifacts/DeepEyeUnlocker-${VERSION}.apk"
          echo "APK_FILE=artifacts/DeepEyeUnlocker-${VERSION}.apk" >> $GITHUB_ENV
          ls -lh artifacts/

      # ── Upload build artifact ─────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepEyeUnlocker-signed
          path: artifacts/*.apk
          retention-days: 90

      # ── Create GitHub Release ─────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Cleanup keystore from runner ──────────────────────
      - name: Cleanup keystore
        if: always()
        run: |
          rm -f $RUNNER_TEMP/deepeye-release.jks
          echo "✅ Keystore cleaned from runner"
